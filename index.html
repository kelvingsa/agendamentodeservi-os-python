<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow - Gestão de Bem-Estar</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lavanda: { fundo: '#F3F0F7', primaria: '#6C5CE7', secundaria: '#A29BFE', texto: '#2D3436', card: '#FFFFFF' },
                        botanico: { fundo: '#F0F7F4', primaria: '#10AC84', secundaria: '#1DD1A1', texto: '#222F3E', card: '#FFFFFF' },
                        por_do_sol: { fundo: '#FFF9F5', primaria: '#FF6B6B', secundaria: '#FFA801', texto: '#2C3E50', card: '#FFFFFF' },
                        noite: { fundo: '#1E272E', primaria: '#05C46B', secundaria: '#485460', texto: '#FFFFFF', card: '#2F3640' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body id="body-bg" class="bg-lavanda-fundo text-slate-800 font-sans min-h-screen transition-colors duration-300">
    <header id="header-card" class="bg-white shadow-sm border-b border-slate-100 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div id="brand-logo" class="bg-[#6C5CE7] text-white p-2.5 rounded-xl shadow-md transition-colors duration-300">
                    <i class="fa-solid fa-scissors text-xl"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight" id="main-title">FLOW <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 uppercase tracking-wider ml-1">Protótipo</span></h1>
            </div>
            <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200">
                <label for="theme-select" class="text-xs font-bold uppercase tracking-wider text-slate-500 pl-2">Ambiente:</label>
                <select id="theme-select" onchange="mudarTema(this.value)" class="bg-white border border-slate-200 text-sm rounded-lg px-3 py-1.5 font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1">
                    <option value="lavanda">🪻 Lavanda Relaxante</option>
                    <option value="botanico"> Verde Botânico</option>
                    <option value="por_do_sol"> Pôr do Sol Quente</option>
                    <option value="noite"> Noite Elegante</option>
                </select>
            </div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <section id="form-card" class="lg:col-span-4 bg-white rounded-3xl p-6 border border-slate-100 shadow-xl shadow-slate-100/50 flex flex-col justify-between transition-colors duration-300">
            <div>
                <h2 id="form-title" class="text-xl font-bold text-[#6C5CE7] mb-6 flex items-center gap-2 transition-colors duration-300">
                    <i class="fa-regular fa-calendar-plus"></i> Agendar Momento
                </h2>
                
                <form id="form-agendamento" onsubmit="criarAgendamento(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nome do Cliente</label>
                        <input type="text" id="nome" placeholder="Ex: Lucas Almeida" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6C5CE7]/20 focus:border-[#6C5CE7] transition-all">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Serviço Desejado</label>
                        <select id="servico" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6C5CE7]/20 focus:border-[#6C5CE7] transition-all">
                            <option value="Corte Masculino">Corte Masculino — R$ 45,00</option>
                            <option value="Corte Feminino">Corte Feminino — R$ 70,00</option>
                            <option value="Barba Completa">Barba Completa — R$ 30,00</option>
                            <option value="Combo: Corte + Barba">Combo: Corte + Barba — R$ 65,00</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Profissional de Preferência</label>
                        <select id="profissional" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6C5CE7]/20 focus:border-[#6C5CE7] transition-all">
                            <option value="Carlos Silva (Moderno)">Carlos Silva (Moderno)</option>
                            <option value="Ana Oliveira (Feminino)">Ana Oliveira (Feminino)</option>
                            <option value="Marcos Sousa (Clássico)">Marcos Sousa (Clássico)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Data Escolhida</label>
                            <input type="date" id="data" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6C5CE7]/20 focus:border-[#6C5CE7] transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Horário Ideal</label>
                            <select id="horario" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#6C5CE7]/20 focus:border-[#6C5CE7] transition-all">
                                <option value="09:00">09:00</option>
                                <option value="10:00">10:00</option>
                                <option value="11:00">11:00</option>
                                <option value="13:00">13:00</option>
                                <option value="14:00">14:00</option>
                                <option value="15:00">15:00</option>
                                <option value="16:00">16:00</option>
                                <option value="17:00">17:00</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full mt-4 bg-[#6C5CE7] hover:opacity-90 text-white font-bold text-sm rounded-xl py-3.5 shadow-lg shadow-[#6C5CE7]/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-sparkles"></i> Confirmar Horário
                    </button>
                </form>
            </div>
            
        
            <div id="info-box" class="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-100 flex gap-3 text-xs text-slate-600">
                <span class="text-base text-amber-500"><i class="fa-regular fa-lightbulb"></i></span>
                <p><strong>Dica de Uso:</strong> Você pode clicar em qualquer linha da tabela para selecioná-la e usar os botões do menu inferior de ações.</p>
            </div>
        </section>

        
        <section class="lg:col-span-8 flex flex-col justify-between">
            <div>
            
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 id="table-title" class="text-xl font-bold text-[#6C5CE7] transition-colors duration-300">Agenda do Salão</h2>
                    <div class="w-full sm:w-auto flex items-center gap-2 bg-white rounded-xl px-3 py-1.5 border border-slate-200 shadow-sm focus-within:ring-2 focus-within:ring-[#6C5CE7]/20">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
                        <input type="text" id="busca" oninput="filtrarClientes()" placeholder="Buscar cliente por nome..." class="bg-transparent text-sm w-full sm:w-60 focus:outline-none">
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-100 shadow-xl shadow-slate-100/50 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr id="table-header" class="bg-[#A29BFE] text-white font-semibold transition-colors duration-300">
                                    <th class="p-4 w-16 text-center">ID</th>
                                    <th class="p-4">Cliente</th>
